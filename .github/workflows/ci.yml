# Проверки на каждый push и pull request (CLAUDE.md, разделы 12 и 16).
# Бюджеты размера: статически — src/canvas/assets.test.ts (vitest), по трафику — e2e/budgets.spec.ts.
# Любое превышение бюджета, ошибка типов, lint, тестов или сборки — CI красный.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
