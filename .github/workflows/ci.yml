# Проверки на каждый push и pull request (CLAUDE.md, разделы 12 и 16).
# Бюджеты размера: статически — src/canvas/assets.test.ts (vitest), по трафику — e2e/budgets.spec.ts.
# Любое превышение бюджета, ошибка типов, lint, тестов или сборки — CI красный.
# Мёрж в main — только при зелёных задачах check, e2e и audit (защита ветки, docs/deploy.md);
# после мёржа — выкладка в production (deploy.yml).
name: CI

on:
  push:
  pull_request:
  # Раз в неделю — аудит зависимостей: новые уязвимости появляются и без наших коммитов.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  # Аудит зависимостей (CLAUDE.md, раздел 14).
  # Рабочие зависимости (то, что попадает на сайт и сервер): high и выше — CI красный.
  # Инструменты разработки (Lighthouse, Playwright…): только critical — у @lhci/cli есть
  # high-уязвимости без исправления, на сайт этот код не попадает (docs/security.md).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:deps
      # Подписи пакетов реестра npm: пакет не подменён по дороге.
      - run: npm audit signatures

  # Быстрые проверки: типы, lint, формат, unit (в т.ч. бюджеты ассетов), сборка релиза,
  # выкладка и откат теми же скриптами, что на сервере; Lighthouse CI — на PR.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:fast
      # Выкладка и откат теми же скриптами, что на сервере: откат < 1 мин, без сбоев запросов.
      - run: npm run verify:rollback
      # Lighthouse CI на каждый PR (раздел 12): LCP, CLS, вес, доступность, SEO, лучшие практики.
      - run: npm run lhci
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  # e2e без живого 3D (страницы, бриф, доступность, SEO и curl-тест, заголовки) — Linux, 2 части.
  e2e-dom:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_GROUP: dom
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-dom-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # e2e с живым 3D (сцены глав, бюджеты загрузки high/medium) — macOS: у Linux-серверов GitHub
  # нет видеокарты, 3D там рисуется процессором в разы медленнее (playwright.config.ts, GPU_SPECS).
  e2e-gpu:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_GROUP: gpu
      E2E_GPU: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Видеоадаптер WebGL (SwiftShader = без видеокарты)
        run: node scripts/gpu-info.mjs --use-angle=metal
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-gpu-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Одна отметка для защиты ветки: зелёная, только если зелёные все части e2e.
  e2e:
    if: always() && github.event_name != 'schedule'
    needs: [e2e-dom, e2e-gpu]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-dom.result }}" = "success" && test "${{ needs.e2e-gpu.result }}" = "success"
