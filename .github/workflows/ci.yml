# Проверки на каждый push и pull request (CLAUDE.md, разделы 12 и 16).
# Бюджеты размера: статически — src/canvas/assets.test.ts (vitest), по трафику — e2e/budgets.spec.ts.
# Любое превышение бюджета, ошибка типов, lint, тестов или сборки — CI красный.
# Мёрж в main — только при зелёных задачах check и audit (защита ветки, docs/deploy.md);
# после мёржа — выкладка в production (deploy.yml).
name: CI

on:
  push:
  pull_request:
  # Раз в неделю — аудит зависимостей: новые уязвимости появляются и без наших коммитов.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  # Аудит зависимостей (CLAUDE.md, раздел 14).
  # Рабочие зависимости (то, что попадает на сайт и сервер): high и выше — CI красный.
  # Инструменты разработки (Lighthouse, Playwright…): только critical — у @lhci/cli есть
  # high-уязвимости без исправления, на сайт этот код не попадает (docs/security.md).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:deps
      # Подписи пакетов реестра npm: пакет не подменён по дороге.
      - run: npm audit signatures

  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # typecheck, lint, формат, unit (в т.ч. бюджеты ассетов), сборка релиза, e2e (в т.ч. бюджеты
      # по трафику и curl-тест SEO: e2e/seo.spec.ts).
      - run: npm run check
      # Выкладка и откат теми же скриптами, что на сервере: откат < 1 мин, без сбоев запросов.
      - run: npm run verify:rollback
      # Lighthouse CI на каждый PR (раздел 12): LCP, CLS, вес, доступность, SEO, лучшие практики.
      - run: npm run lhci
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
