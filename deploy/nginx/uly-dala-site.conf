# /etc/nginx/sites-available/uly-dala — сайт (общий сервер с nginx, docs/deploy.md).
# __DOMAIN__ подставляет setup-server-nginx.sh. HTTPS добавляет certbot --nginx (он же продлевает).
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    access_log /var/log/nginx/uly-dala.log uly_dala;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    server_tokens off;

    if ($host = www.__DOMAIN__) {
        return 301 $scheme://__DOMAIN__$request_uri;
    }

    # Сборка Next.js и ассеты с хешем в имени — из общего хранилища, «навсегда».
    # Файла нет (неверный хеш) — 404, а не чужое содержимое под вечным кэшем.
    location /_next/static/ {
        root /srv/uly-dala/cdn;
        include /etc/nginx/uly-dala/types.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~ "^/assets/.+\.[0-9a-f]{10}\.[a-z0-9]+$" {
        root /srv/uly-dala/cdn;
        include /etc/nginx/uly-dala/types.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://uly_dala;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Только адрес посетителя (не дописывать к присланному — иначе обход rate limit).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
