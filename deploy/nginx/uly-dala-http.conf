# /etc/nginx/conf.d/uly-dala.conf — уровень http (общий сервер с nginx, docs/deploy.md).
# Слот, который сейчас обслуживает сайт (3001 или 3002), — в upstream.conf, его пишет deploy/bin/lib.sh.
upstream uly_dala {
    include /etc/nginx/uly-dala/upstream.conf;
    keepalive 16;
}

# Журнал без IP и query (CLAUDE.md, раздел 14: персональных данных нет в логах).
log_format uly_dala '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
