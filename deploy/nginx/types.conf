# MIME статики (то же — src/lib/security/delivery.ts): в стандартной таблице nginx нет .glb, .ktx2, сплатов.
types {
    text/css css;
    application/javascript js mjs;
    application/json json map;
    image/jpeg jpg jpeg;
    image/png png;
    image/webp webp;
    image/avif avif;
    image/svg+xml svg;
    image/x-icon ico;
    font/woff2 woff2;
    font/woff woff;
    model/gltf-binary glb;
    image/ktx2 ktx2;
    application/wasm wasm;
    application/octet-stream splat spz ply bin;
    video/mp4 mp4;
    video/webm webm;
    video/quicktime mov;
    audio/mp4 m4a;
    text/plain txt;
}
